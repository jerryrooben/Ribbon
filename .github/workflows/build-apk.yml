name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare web files
        run: node scripts/prepare.js

      - name: Create Android project
        run: npx cap add android

      - name: Icons and colors
        run: |
          pip install pillow
          python3 scripts/make_icon.py
          node scripts/android-patch.js

      - name: Sync
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ribbon.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ribbon-apk
          path: Ribbon.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Ribbon APK ${{ github.run_number }}
          files: Ribbon.apk
