<title>Ribbon</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* Layout: one phone-width column. Home = centered BOOKS masthead, shelves with colored ledges, black Add Books pill.
   Reader = full-screen reflowed text that turns like paper, with one floating pill bar at the bottom. */
:root{
  --bg:#ECE8E1; --bg2:#E0DAD0; --fg:#141211; --muted:#7A7369; --line:rgba(20,18,17,.16);
  --red:#7D1519; --red-ink:#F3EEE6; --sheet:#F3EFE8;
  --pill-bg:#141211; --pill-fg:#ECE8E1;
  --ledge1:#7D1519; --ledge2:#1B1918; --ledge3:#B7AD9D;
  --c-red:#7D1519; --c-wine:#4A0C11; --c-ink:#171514; --c-bone:#E7E1D6;
  --cover-shadow:0 12px 16px -10px rgba(20,18,17,.55);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
  --f-display:'Bodoni Moda','Didot','Bodoni 72','Times New Roman',serif;
  --f-read:'Newsreader',Georgia,'Times New Roman',serif;
  --f-label:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0D0D; --bg2:#1A1817; --fg:#ECE8E1; --muted:#968E82; --line:rgba(236,232,225,.18);
    --red:#A6232A; --red-ink:#FBF6EE; --sheet:#1A1817;
    --pill-bg:#ECE8E1; --pill-fg:#141211;
    --ledge1:#8F1B21; --ledge2:#2C2928; --ledge3:#7F776B;
    --cover-shadow:0 12px 16px -10px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0D0D; --bg2:#1A1817; --fg:#ECE8E1; --muted:#968E82; --line:rgba(236,232,225,.18);
  --red:#A6232A; --red-ink:#FBF6EE; --sheet:#1A1817;
  --pill-bg:#ECE8E1; --pill-fg:#141211;
  --ledge1:#8F1B21; --ledge2:#2C2928; --ledge3:#7F776B;
  --cover-shadow:0 12px 16px -10px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-read);font-size:16px;
  padding-block:14px 140px;padding-left:var(--gl);padding-right:var(--gr);-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,.book:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.label{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.icon-btn svg{display:block}

/* Home */
#home{max-width:560px;margin:0 auto}
.mast{text-align:center}
.mast-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
.mast h1{font:700 clamp(76px,25vw,136px)/.86 var(--f-display);letter-spacing:-.02em;margin:4px 0 16px}
.search{width:100%;height:42px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);
  padding:0 18px;font:400 13px var(--f-label);letter-spacing:.04em}
.search::placeholder{color:var(--muted)}
.resume{display:flex;align-items:center;gap:14px;margin-top:20px;padding:10px 12px 10px 10px;border-radius:22px;background:var(--bg2);text-align:left;width:100%}
.resume .mini{width:46px;flex:0 0 auto}
.resume .meta{flex:1;min-width:0}
.resume .t{font:500 18px/1.15 var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume .s{margin-top:5px;font-family:var(--f-label);font-size:11px;letter-spacing:.06em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume .go{width:40px;height:40px;border-radius:50%;background:var(--red);color:var(--red-ink);display:grid;place-items:center;flex:0 0 auto}
.shelf{margin-top:30px}
.shelf-head{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.shelf-head h2{margin:0;font:600 17px var(--f-read);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf-head .arrows{display:flex;gap:2px;color:var(--muted)}
.shelf-head .arrows button{width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.stand{position:relative;margin-left:calc(var(--gl)*-1);margin-right:calc(var(--gr)*-1)}
.row{display:flex;gap:14px;overflow-x:auto;padding:10px var(--gr) 24px var(--gl);scroll-snap-type:x proximity;scroll-padding-left:var(--gl);scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.ledge{position:absolute;left:8px;right:8px;bottom:0;height:46px;border-radius:8px;background:var(--ledge);opacity:.95;pointer-events:none;
  box-shadow:0 14px 18px -14px rgba(0,0,0,.6)}
.ledge i{position:absolute;top:50%;width:9px;height:9px;margin-top:-4px;border-radius:50%;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.ledge i:first-child{left:12px}.ledge i:last-child{right:12px}
.book{position:relative;flex:0 0 auto;width:98px;aspect-ratio:2/3;scroll-snap-align:start;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;border-radius:3px 7px 7px 3px}
.cover{position:relative;width:100%;height:100%;overflow:hidden;border-radius:3px 7px 7px 3px;background-size:cover;background-position:center;
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.25),var(--cover-shadow)}
.cover::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,rgba(255,255,255,.18),rgba(0,0,0,.12))}
.cover .ct{position:absolute;left:14px;right:9px;top:13px;font:700 15px/1.04 var(--f-display);letter-spacing:-.01em;overflow:hidden;max-height:62%}
.cover .ct.m{font-size:13px}.cover .ct.s{font-size:11px;line-height:1.08}
.cover .g{position:absolute}
.cover.t0{background-color:var(--c-red);color:var(--c-bone)} .t0 .g{width:46px;height:46px;border-radius:50%;background:var(--c-bone);left:14px;bottom:36px}
.cover.t1{background-color:var(--c-ink);color:var(--c-bone)} .t1 .g{left:0;right:0;bottom:46px;height:12px;background:var(--c-red)}
.cover.t2{background-color:var(--c-bone);color:var(--c-ink)} .t2 .g{width:40px;height:40px;background:var(--c-red);right:12px;bottom:40px}
.cover.t3{background-color:var(--c-wine);color:var(--c-bone)} .t3 .g{width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-bottom:54px solid var(--c-ink);left:16px;bottom:34px}
.chip{position:absolute;top:6px;right:6px;z-index:2;font:500 9px var(--f-label);letter-spacing:.08em;background:var(--c-ink);color:var(--c-bone);padding:3px 5px;border-radius:3px}
.chip.done{background:var(--c-red)}
.empty{margin-top:34px;padding:28px 20px;border:1px dashed var(--line);border-radius:18px;text-align:center}
.empty b{display:block;font:500 24px var(--f-display);margin-bottom:6px}
.empty span{color:var(--muted);font-size:15px}
.hint{margin-top:34px;text-align:center}
.add-pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:10;height:52px;padding:0 34px;border-radius:999px;
  background:var(--pill-bg);color:var(--pill-fg);font:500 16px var(--f-read);box-shadow:0 14px 28px -12px rgba(0,0,0,.55)}

/* Reader */
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);opacity:0;transform:translateY(16px);transition:opacity .28s ease,transform .28s ease}
.reader.in{opacity:1;transform:none}
.r-in{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}
.r-top,.r-foot{transition:opacity .25s ease}
.r-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;padding:0 var(--gr) 0 var(--gl)}
.r-title{text-align:center;min-width:0}
.r-title .label{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.r-title strong{display:block;margin-top:3px;font:600 15px/1.2 var(--f-sans);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.reader.bars-hidden .r-top,.reader.bars-hidden .r-foot{opacity:0;pointer-events:none}
.stage{position:relative;flex:1;min-height:0;margin:6px 0;perspective:1800px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sheet{position:absolute;inset:0;background:var(--bg);transform-origin:0 50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;will-change:transform}
.sheet.flip{box-shadow:0 0 50px rgba(0,0,0,.28)}
.sheet .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:2}
.win{position:absolute;left:max(24px,var(--gl));right:max(24px,var(--gr));top:10px;bottom:10px;overflow:hidden}
.cols{position:absolute;left:0;top:0;column-fill:auto;font-family:var(--ff,var(--f-read));font-size:var(--fs,19px);line-height:1.6;color:var(--fg);
  transition:none;-webkit-font-smoothing:antialiased}
.cols .b{margin:0}
.cols p{text-indent:1.4em;text-align:justify;hyphens:auto;-webkit-hyphens:auto;orphans:2;widows:2}
.cols .first,.cols .h+p{text-indent:0}
.cols .h+p::first-letter,.cols .first::first-letter{float:left;font-family:var(--f-display);font-weight:500;font-size:3.5em;line-height:.8;padding:.07em .09em 0 0}
.cols h2{margin:0 0 .7em;font:500 1.55em/1.15 var(--f-display);text-align:left;break-after:avoid-column;break-inside:avoid;-webkit-column-break-inside:avoid}
.cols .b.h:not(:first-child){margin-top:1.2em}
.ribbon{position:absolute;top:-2px;right:max(30px,calc(var(--gr) + 8px));z-index:6;width:22px;height:50px;background:var(--red);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);transform:translateY(-110%);transition:transform .3s ease;pointer-events:none}
.ribbon.on{transform:none}
.r-foot{display:flex;justify-content:center;align-items:center;gap:10px;padding:6px var(--gr) 0 var(--gl)}
.pill{height:46px;border-radius:999px;background:var(--pill-bg);color:var(--pill-fg);display:inline-flex;align-items:center;justify-content:center;padding:0 16px;font:500 13px var(--f-label);letter-spacing:.04em;white-space:nowrap}
.pill.round{width:46px;padding:0}
.pill.on{background:var(--red);color:var(--red-ink)}
.seg{padding:4px;gap:2px;background:transparent;border:2px solid var(--pill-bg)}
.seg button{height:32px;padding:0 13px;border-radius:999px;font:500 13px var(--f-label);letter-spacing:.02em;color:var(--fg)}
.seg button.on{background:var(--pill-bg);color:var(--pill-fg)}

/* Sheets */
.modal{position:fixed;inset:0;z-index:40;background:rgba(10,8,8,0);transition:background .26s ease}
.modal.open{background:rgba(10,8,8,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:84%;overflow:auto;background:var(--sheet);color:var(--fg);
  border-radius:26px 26px 0 0;padding:20px var(--gr) calc(24px + env(safe-area-inset-bottom,0px)) var(--gl);transform:translateY(102%);transition:transform .28s ease}
.modal.open .panel{transform:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.panel-head h3{margin:0;font:500 26px var(--f-display)}
.sp{margin:18px 0 8px}
.field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--fg);padding:0 14px;font:400 16px var(--f-read);margin-top:6px}
.field::placeholder{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-b{border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:500 13px var(--f-label);letter-spacing:.02em}
.chip-b.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-row{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;height:48px;border-radius:999px;background:var(--pill-bg);color:var(--pill-fg);font:500 15px var(--f-read);padding:0 20px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.danger.arm{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.li{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line)}
.li-main{flex:1;min-width:0;text-align:left;padding:13px 0;display:block}
.li-main span{display:block;font:500 16px/1.3 var(--f-read);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.li-main .label{display:block;margin-top:5px}
.li.cur .li-main span{color:var(--red)}
.li-x{width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}
.none{padding:18px 0;color:var(--muted);font-size:15px}
.rowline{display:flex;align-items:center;gap:12px;margin-top:6px}
.rowline .lab{width:78px;flex:0 0 auto}
.rowline input[type=range]{flex:1;accent-color:var(--red);min-width:0}
.rowline .chips{flex:1}
.stepbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:500 15px var(--f-read)}

/* Import + toast */
.import{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px var(--gr) 24px var(--gl);text-align:center}
.import b{display:block;font:500 34px/1.05 var(--f-display);margin-bottom:12px}
.import .bar{margin:22px auto 0;width:min(260px,80vw);height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.import .bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s ease}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);z-index:60;max-width:calc(100vw - 32px);
  background:var(--pill-bg);color:var(--pill-fg);padding:10px 16px;border-radius:999px;font:500 12px var(--f-label);letter-spacing:.04em;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){
  .reader,.modal,.panel,.toast,.ribbon{transition:none}
}
</style>

<div id="home">
  <header class="mast">
    <div class="mast-top">
      <span></span>
      <span class="label">My Library</span>
      <button class="icon-btn" id="themeBtn" aria-label="Switch light or dark"></button>
    </div>
    <h1>BOOKS</h1>
    <input class="search" id="q" type="search" placeholder="Search titles" aria-label="Search titles" autocomplete="off">
  </header>
  <div id="resumeBox"></div>
  <div id="shelves"></div>
  <p class="hint label" id="hint">Hold a book to rename, move or remove it</p>
</div>
<button class="add-pill" id="addBtn">Add Books</button>
<input type="file" id="file" accept="application/pdf,.pdf" multiple tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">

<section class="reader" id="reader" hidden aria-label="Reader">
  <div class="r-in">
    <div class="r-top">
      <button class="icon-btn" id="rBack" aria-label="Back to library"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="r-title"><span class="label" id="rBook"></span><strong id="rChap"></strong></div>
      <span></span>
    </div>
    <div class="stage" id="stage">
      <div class="sheet" id="sheetA"><div class="win"><div class="cols" lang="en"></div></div><div class="shade"></div></div>
      <div class="sheet" id="sheetB"><div class="win"><div class="cols" lang="en"></div></div><div class="shade"></div></div>
      <div class="ribbon" id="ribbon"></div>
    </div>
    <div class="r-foot">
      <span class="pill" id="pct">0%</span>
      <div class="pill seg"><button id="tabToc">Contents</button><button id="tabClips">Clips</button></div>
      <button class="pill round" id="clipBtn" aria-label="Clip this page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M7 4h10v16l-5-4-5 4z"/></svg></button>
      <button class="pill round" id="aaBtn" aria-label="Text settings"><span style="font:500 17px var(--f-read)">Aa</span></button>
    </div>
  </div>
</section>

<div class="modal" id="modal" hidden>
  <div class="panel" id="panel" role="dialog" aria-modal="true">

    <div id="panelBody"></div>
  </div>
</div>
<div class="import" id="import" hidden>
  <div><b id="impTitle">Reading your book</b><span class="label" id="impSub">Starting</span><div class="bar"><i id="impBar"></i></div></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var wait=function(ms){return new Promise(function(r){setTimeout(r,ms);});};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);};
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function hash(s){var h=0;for(var i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;}return Math.abs(h);}
var reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- text extraction (reflow) ---------- */
//EXTRACT-START
var ENDP=/[.!?”"’')\]:;]\s*$/;
function splitLong(blocks){
  var out=[];
  blocks.forEach(function(b){
    if(b.t!=='p'||b.x.length<3200){out.push(b);return;}
    var rest=b.x;
    while(rest.length>3200){
      var cut=-1,i=1900;
      for(;i<2800;i++){ if(/[.!?]/.test(rest[i])&&rest[i+1]===' '){cut=i+1;break;} }
      if(cut<0)cut=rest.indexOf(' ',2400); if(cut<0)break;
      out.push({t:'p',x:rest.slice(0,cut).trim()}); rest=rest.slice(cut).trim();
    }
    if(rest)out.push({t:'p',x:rest});
  });
  return out;
}
async function extractBlocks(pdf,onP){
  var lines=[],p1chars=0,total=pdf.numPages;
  for(var n=1;n<=total;n++){
    var page=await pdf.getPage(n); var vp=page.getViewport({scale:1}); var tc=await page.getTextContent();
    var cur=null,pl=[];
    for(var k=0;k<tc.items.length;k++){
      var it=tc.items[k]; if(typeof it.str!=='string'||it.str==='')continue;
      var tr=it.transform; var h=Math.abs(tr[3])||it.height||10; var x=tr[4],y=tr[5];
      if(cur&&Math.abs(y-cur.y)<Math.max(2,cur.h*0.45)){
        var gap=x-cur.x1;
        if(gap>cur.h*0.15&&!/\s$/.test(cur.t)&&!/^\s/.test(it.str))cur.t+=' ';
        cur.t+=it.str; cur.x1=x+(it.width||0); if(h>cur.h)cur.h=h;
      }else{
        if(cur)pl.push(cur);
        cur=it.str.trim()?{t:it.str,x:x,y:y,h:h,x1:x+(it.width||0)}:null;
      }
    }
    if(cur)pl.push(cur);
    pl.forEach(function(l){
      var top=vp.height-l.y; var txt=l.t.trim();
      if((top<vp.height*0.1||top>vp.height*0.9)&&/^(\d{1,4}|[ivxlcdm]{1,7}|page\s+\d+(\s+of\s+\d+)?)$/i.test(txt))return;
      if(n===1)p1chars+=txt.length;
      lines.push({t:l.t,x:l.x,y:l.y,h:l.h,page:n,top:top,pageH:vp.height});
    });
    if(onP)onP(n,total);
    if(n%3===0)await new Promise(function(r){setTimeout(r,0);});
  }
  var chars=0; lines.forEach(function(l){chars+=l.t.length;});
  var hist=new Map(); lines.forEach(function(l){var key=Math.round(l.h*2)/2;hist.set(key,(hist.get(key)||0)+l.t.length);});

  $('#pct').textContent=Math.round(pct*100)+'%';
  $('#rBook').textContent=b.title;$('#rChap').textContent=ch?ch.title:'';
  var clipped=isClipped();$('#ribbon').classList.toggle('on',clipped);$('#clipBtn').classList.toggle('on',clipped);
  b.pos=pos;b.progress=pct;b.chapterTitle=ch?ch.title:'';b.openedAt=Date.now();persistMeta();
}
var saveT=null;
function persistMeta(now){clearTimeout(saveT);var f=function(){if(R.book)putBook(R.book).catch(function(){});};if(now)f();else saveT=setTimeout(f,350);}
document.addEventListener('visibilitychange',function(){if(document.hidden)persistMeta(true);});
window.addEventListener('pagehide',function(){persistMeta(true);});

async function turn(dir){
  if(R.busy||!R.T||reader.hidden)return;
  var A=R.sheets[R.active],B=R.sheets[1-R.active],T=R.T,tc,tp;
  if(dir>0){
    if(A.page<A.pages-1){tc=A.chunk;tp=A.page+1;}else if(A.chunk<T.chunks.length-1){tc=A.chunk+1;tp=0;}else return bounce(dir);
  }else{
    if(A.page>0){tc=A.chunk;tp=A.page-1;}else if(A.chunk>0){tc=A.chunk-1;tp=-1;}else return bounce(dir);
  }
  R.busy=true;
  B.el.style.transition='none';B.el.style.transform='none';B.shade.style.transition='none';B.shade.style.opacity='0';
  loadSheet(B,tc,tp<0?0:tp);if(tp<0)setPage(B,B.pages-1);
  var dur=reduceMotion?0:560,ease='cubic-bezier(.5,.02,.2,1)';
  if(dir>0){
    A.el.style.zIndex=3;B.el.style.zIndex=2;A.shade.style.opacity='0';
    B.shade.style.opacity='.4';void B.el.offsetWidth;
    A.el.classList.add('flip');A.el.style.transition='transform '+dur+'ms '+ease;A.el.style.transform='rotateY(-100deg)';
    B.shade.style.transition='opacity '+dur+'ms ease';B.shade.style.opacity='0';
    await wait(dur+40);
    A.el.classList.remove('flip');A.el.style.transition='none';A.el.style.transform='none';A.el.style.zIndex=1;B.el.style.zIndex=3;
  }else{
    A.el.style.zIndex=2;B.el.style.zIndex=3;B.el.classList.add('flip');
    B.el.style.transform='rotateY(-100deg)';void B.el.offsetWidth;
    B.el.style.transition='transform '+dur+'ms '+ease;B.el.style.transform='none';
    A.shade.style.transition='opacity '+dur+'ms ease';A.shade.style.opacity='.4';
    await wait(dur+40);
    B.el.classList.remove('flip');A.shade.style.transition='none';A.shade.style.opacity='0';A.el.style.zIndex=1;
  }
  R.active=1-R.active;R.busy=false;updateUI();
}
function bounce(dir){
  var A=R.sheets[R.active];toast(dir>0?'You have reached the last page':'This is the first page');
  if(!reduceMotion&&A.el.animate)A.el.animate([{transform:'none'},{transform:'rotateY('+(dir>0?-5:5)+'deg)'},{transform:'none'}],{duration:280,easing:'ease-out'});
}
function jumpTo(block,frag){
  var A=R.sheets[R.active];placeAt(block,frag);updateUI();
  if(!reduceMotion&&A.el.animate)A.el.animate([{opacity:0},{opacity:1}],{duration:220});
}

/* gestures */
var g=null;
stage.addEventListener('pointerdown',function(e){g={x:e.clientX,y:e.clientY,t:Date.now()};});
stage.addEventListener('pointercancel',function(){g=null;});
stage.addEventListener('pointerup',function(e){
  if(!g)return;var dx=e.clientX-g.x,dy=e.clientY-g.y;g=null;
  if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.3){turn(dx<0?1:-1);return;}
  if(Math.abs(dx)<12&&Math.abs(dy)<12){
    var r=stage.getBoundingClientRect(),f=(e.clientX-r.left)/r.width;
    if(f<0.32)turn(-1);else if(f>0.68)turn(1);else reader.classList.toggle('bars-hidden');
  }
});

/* open / close */
async function fontsReady(){try{await Promise.race([Promise.all([document.fonts.load('400 19px Newsreader'),document.fonts.load('500 24px "Bodoni Moda"')]),wait(1800)]);}catch(e){}}
async function openBook(id){
  var b=BOOKS.find(function(x){return x.id===id;});if(!b)return;
  reader.hidden=false;document.body.classList.add('lock');reader.classList.remove('bars-hidden');
  void reader.offsetWidth;reader.classList.add('in');
  $('#rBook').textContent=b.title;$('#rChap').textContent='';
  var T=null;try{T=await getText(id);}catch(e){}
  if(!T){toast('The text of this book is missing. Add the PDF again.');closeReader();return;}
  R.book=b;R.T=T;R.busy=false;
  await fontsReady();geometry();
  R.sheets.forEach(function(s,i){s.chunk=-1;s.el.style.transition='none';s.el.style.transform='none';s.el.style.zIndex=i===0?3:1;});
  R.active=0;
  var p=b.pos;placeAt(p?p.block:0,p?p.frag:0);updateUI();
}
function closeReader(){
  persistMeta(true);reader.classList.remove('in');
  setTimeout(function(){reader.hidden=true;document.body.classList.remove('lock');R.T=null;R.book=null;},reduceMotion?0:280);
  renderHome();
}
$('#rBack').onclick=closeReader;
function relayout(){
  if(!R.T||reader.hidden)return;var pos=curPos();geometry();
  R.sheets.forEach(function(s,i){s.chunk=-1;s.el.style.transition='none';s.el.style.transform='none';s.el.style.zIndex=i===R.active?3:1;});
  placeAt(pos.block,0);updateUI();
}
var rzT=null;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(relayout,220);});
try{document.fonts.addEventListener('loadingdone',function(){clearTimeout(rzT);rzT=setTimeout(relayout,120);});}catch(e){}

/* clips, contents, text panel */
$('#clipBtn').onclick=function(){
  if(!R.T)return;var b=R.book,bl=pageBlocks(),s=R.sheets[R.active];
  var hit=(b.clips||[]).filter(function(c){return bl.indexOf(c.block)>=0;});
  if(hit.length){b.clips=b.clips.filter(function(c){return hit.indexOf(c)<0;});toast('Clip removed');}
  else{
    var fb=bl[0],txt=R.T.blocks[fb].x;
    b.clips=(b.clips||[]).concat([{block:fb,frag:s.page-firstPageOf(s,fb),snippet:txt.slice(0,90),pct:b.progress||0,at:Date.now()}]);
    toast('Page clipped');
  }
  persistMeta(true);updateUI();
};
function showNav(tab){
  var b=R.book;if(!b)return;
  var head='<div class="tabs"><button class="chip-b'+(tab==='toc'?' on':'')+'" data-t="toc">Contents</button><button class="chip-b'+(tab==='clips'?' on':'')+'" data-t="clips">Clips ('+(b.clips||[]).length+')</button></div>';
  var body='';
  if(tab==='toc'){
    var cur=R.sheets[R.active].map[R.sheets[R.active].page][0],cc=-1;
    b.chapters.forEach(function(c,i){if(c.b<=cur)cc=i;});
    body=b.chapters.length?b.chapters.map(function(c,i){return '<div class="li'+(i===cc?' cur':'')+'"><button class="li-main" data-b="'+c.b+'"><span>'+esc(c.title)+'</span></button></div>';}).join(''):'<div class="none">No chapter headings were found in this PDF.</div>';
  }else{
    var cl=(b.clips||[]).slice().sort(function(x,y){return x.block-y.block;});
    body=cl.length?cl.map(function(c){return '<div class="li"><button class="li-main" data-b="'+c.block+'" data-f="'+(c.frag||0)+'"><span>'+esc(c.snippet)+'</span><span class="label">'+Math.round(c.pct*100)+'% · '+new Date(c.at).toLocaleDateString(undefined,{day:'numeric',month:'short'})+'</span></button><button class="li-x" data-at="'+c.at+'" aria-label="Remove clip">'+ICON.x+'</button></div>';}).join(''):'<div class="none">No clipped pages yet. Tap the red ribbon button to clip the page you are on.</div>';
  }
  var html=head+body;
  if(modal.hidden)openSheet(tab==='toc'?'Contents':'Clips',html,bindNav);else{$('#panelTitle').textContent=tab==='toc'?'Contents':'Clips';$('#panelBody').innerHTML=html;bindNav($('#panelBody'));}
}
function bindNav(root){
  root.querySelectorAll('[data-t]').forEach(function(x){x.onclick=function(){showNav(x.dataset.t);};});
  root.querySelectorAll('.li-main').forEach(function(x){x.onclick=function(){closeSheet();jumpTo(+x.dataset.b,+(x.dataset.f||0));};});
  root.querySelectorAll('.li-x').forEach(function(x){x.onclick=function(){
    var at=+x.dataset.at;R.book.clips=R.book.clips.filter(function(c){return c.at!==at;});persistMeta(true);updateUI();showNav('clips');};});
}
$('#tabToc').onclick=function(){showNav('toc');};
$('#tabClips').onclick=function(){showNav('clips');};
$('#aaBtn').onclick=function(){
  openSheet('Text','<div class="rowline"><span class="label lab">Size</span><button class="stepbtn" id="fsDn" aria-label="Smaller text">A</button><input type="range" id="fsR" min="15" max="26" step="1" value="'+P.fs+'" aria-label="Text size"><button class="stepbtn" id="fsUp" aria-label="Larger text" style="font-size:20px">A</button></div>'+
    '<div class="rowline" style="margin-top:18px"><span class="label lab">Typeface</span><div class="chips"><button class="chip-b'+(P.ff==='serif'?' on':'')+'" data-ff="serif">Serif</button><button class="chip-b'+(P.ff==='sans'?' on':'')+'" data-ff="sans">Sans</button></div></div>'+
    '<div class="rowline" style="margin-top:18px"><span class="label lab">Page</span><div class="chips"><button class="chip-b'+(effTheme()==='light'?' on':'')+'" data-th="light">Paper</button><button class="chip-b'+(effTheme()==='dark'?' on':'')+'" data-th="dark">Ink</button></div></div>',function(root){
    var rt=null,set=function(v){P.fs=Math.max(15,Math.min(26,v));lsSet('ribbon-prefs',P);$('#fsR',root).value=P.fs;clearTimeout(rt);rt=setTimeout(relayout,120);applyType();};
    $('#fsR',root).oninput=function(){set(+this.value);};
    $('#fsDn',root).onclick=function(){set(P.fs-1);};$('#fsUp',root).onclick=function(){set(P.fs+1);};
    root.querySelectorAll('[data-ff]').forEach(function(x){x.onclick=function(){P.ff=x.dataset.ff;lsSet('ribbon-prefs',P);
      root.querySelectorAll('[data-ff]').forEach(function(y){y.classList.toggle('on',y===x);});relayout();};});
    root.querySelectorAll('[data-th]').forEach(function(x){x.onclick=function(){setTheme(x.dataset.th);
      root.querySelectorAll('[data-th]').forEach(function(y){y.classList.toggle('on',y===x);});};});
  });
};

/* ---------- sample book ---------- */
function sampleBlocks(){
  var H=function(x){return {t:'h',x:x};},Pp=function(x){return {t:'p',x:x};};
  return [
    H('Welcome to Ribbon'),
    Pp('This is a sample book, so you can try the reader before you add your own. Swipe the page to the left to turn forward and to the right to go back. You can also tap the left or right edge of the page.'),
    Pp('Ribbon reads the text out of your PDF and sets it again for a phone screen. The words flow to fit the page, the way they would in a paperback. Nothing leaves your phone. The books you add stay inside this app.'),
    Pp('Try the Aa button at the bottom. You can make the letters larger, switch between a serif and a sans typeface, and change the page from paper to ink. The number of pages changes with the size, and your place is kept.'),
    H('Your place is always kept'),
    Pp('Close this book and open it again. You will land on the page where you stopped. There is nothing to save and no button to press. Ribbon notes your page every time you turn it.'),
    Pp('The shelf on the home screen shows how far along each book is. The card at the top, Continue Reading, takes you straight back to the last book you opened.'),
    Pp('Tap the middle of a page to hide the buttons while you read. Tap the middle again to bring them back.'),
    H('Clip a page'),
    Pp('Sometimes you want to keep a page for later: a quote, a step in a recipe, a line you do not want to lose. Tap the round ribbon button at the bottom to clip the page you are on. A small red ribbon appears in the corner of the page.'),
    Pp('Tap the button again to remove the clip. Open Clips to see every page you have clipped in this book, with the first words of each one. Tap a clip to jump straight to it.'),
    Pp('Clips and your reading place are two different things. Your place moves forward as you read. A clip stays exactly where you put it.'),
    H('Shelves'),
    Pp('When you add a book, choose a shelf for it or start a new one. Shelves are only names, so use them any way you like: by subject, by year, or by who lent you the book.'),
    Pp('To rename a book, move it to another shelf or remove it, press and hold its cover on the home screen.'),
    H('A note about PDFs'),
    Pp('Ribbon works best with PDFs that contain real text, such as novels, articles, manuals and study notes. PDFs that are only pictures of pages, like scans, have no text to read. If you add one, Ribbon will tell you.'),
    Pp('Tables, columns and illustrations may not survive being reflowed. If a page looks strange, it is the layout of the PDF being flattened into a single column of text.'),
    Pp('That is all you need. Delete this sample whenever you like, then add your first book.')
  ];
}
async function seedSample(){
  var blocks=sampleBlocks(),ck=buildChunks(blocks),id='sample-'+uid();
  var chapters=[];blocks.forEach(function(b,i){if(b.t==='h')chapters.push({b:i,title:b.x});});
  var meta={id:id,title:'Welcome to Ribbon',shelf:'Start here',cover:null,pages:0,addedAt:Date.now(),openedAt:0,progress:0,pos:null,clips:[],chapters:chapters,chapterTitle:'',sample:true};
  await putText({id:id,blocks:blocks,chunks:ck.chunks,cum:ck.cum,chunkChars:ck.chunkChars,total:ck.total});
  await putBook(meta);BOOKS.push(meta);lsSet('ribbon-seeded',1);
}

/* ---------- Android back button (only active inside the installed app) ---------- */
try{
  var CapApp=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;
  if(CapApp&&CapApp.addListener){
    CapApp.addListener('backButton',function(){
      if(!$('#import').hidden)return;
      if(!modal.hidden)closeSheet();
      else if(!reader.hidden)closeReader();
      else if(CapApp.exitApp)CapApp.exitApp();
    });
  }
}catch(e){}

/* ---------- boot ---------- */
(async function(){
  try{
    if(typeof pdfjsLib!=='undefined')pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    db=await openDB();
    try{BOOKS=await allBooks();}catch(e){BOOKS=[];}
    if(!BOOKS.length&&!lsGet('ribbon-seeded',0))await seedSample();
  }catch(e){}
  renderHome();
  if(!db)setTimeout(function(){toast('Saving is off here, so books last only until you close this page.');},600);
})();
})();
</script>
